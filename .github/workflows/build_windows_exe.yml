name: Build Windows EXE with Nuitka

on:
  workflow_dispatch:
  push:
    paths:
      - 'minio_server.py'
      - 'main.py'
      - 'templates/**'
      - 'requirements.txt'
      - 'installer.iss'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.8 (32-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'

      - name: Verify Python environment
        run: |
          python --version
          python -c "import struct; print('Architecture:', struct.calcsize('P') * 8, 'bit')"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Install Nuitka
        run: |
          pip install "nuitka[full]"

      - name: Build EXE with Nuitka (simplified)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          run: |
            python -m nuitka --standalone --include-package=minio --include-package=flask --include-package=flask_cors --include-data-dir=templates=templates --include-data-dir=assets=assets --windows-icon-from-ico=assets/app.ico --output-dir=dist/minio_file_service --output-filename=minio_file_service main.py

      - name: Show Nuitka build logs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "dist\minio_file_service" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 30 FullName, Length
          if (Test-Path "dist\minio_file_service\*.log") {
            Get-Content "dist\minio_file_service\*.log" -ErrorAction SilentlyContinue
          }

      - name: Rename exe if needed
        shell: pwsh
        run: |
          if (Test-Path "dist\minio_file_service\main.exe") {
            Rename-Item "dist\minio_file_service\main.exe" "minio_file_service.exe" -Force
          }
          Get-ChildItem "dist\minio_file_service" -Filter "*.exe" | ForEach-Object { Write-Host $_.Name }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          Write-Host "Using ISCC: $($iscc.FullName)"
          & $iscc.FullName installer.iss
          if (-not $?) { exit 1 }

      - name: Upload standalone folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: minio-file-service-standalone
          path: dist/minio_file_service/
          retention-days: 30

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: minio-file-service-installer
          path: installer/
          retention-days: 30