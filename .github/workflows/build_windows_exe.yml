name: Build Windows 32-bit EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'minio_server.py'
      - 'templates/**'
      - 'requirements.txt'
      - 'minio_server.spec'
      - 'installer.iss'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.8 (32-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'

      - name: Verify Python environment
        run: |
          python --version
          python -c "import struct; print('Architecture:', struct.calcsize('P') * 8, 'bit')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --clean minio_server.spec

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          Write-Host "Using ISCC: $($iscc.FullName)"
          & $iscc.FullName installer.iss
          if (-not $?) { exit 1 }

      - name: Upload folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: minio-file-service-win32
          path: dist/minio_file_service/
          retention-days: 30

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: minio-file-service-installer
          path: installer/
          retention-days: 30