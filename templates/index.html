<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinIO 文件管理服务</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden !important;
        }
        /* Hide scrollbar on non-scrollable containers */
        .main, .panel, .card {
            scrollbar-width: none;
        }
        .main::-webkit-scrollbar, .panel::-webkit-scrollbar, .card::-webkit-scrollbar {
            display: none;
        }
        /* ===== 默认: 白昼模式 (白蓝) ===== */
        :root {
            --primary: #1976d2;
            --primary-dark: #1565c0;
            --primary-glow: rgba(25, 118, 210, 0.18);
            --neon-purple: #7c4dff;
            --success: #43a047;
            --danger: #e53935;
            --warning: #f9a825;
            --bg: #f5f7fb;
            --card-bg: #ffffff;
            --card-border: #e0e6ef;
            --sidebar-bg: #ffffff;
            --sidebar-active: #e8f0fe;
            --sidebar-hover: #f2f6fd;
            --text: #1f2937;
            --text-secondary: #5a6b84;
            --text-light: #94a3b8;
            --border: #dbe3ee;
            --radius: 6px;
            --shadow: 0 1px 3px rgba(25, 118, 210, 0.08);
            --shadow-glow: 0 2px 8px rgba(25, 118, 210, 0.12);
        }
        /* ===== 深色模式 ===== */
        html[data-theme="dark"] {
            --primary: #00e5ff;
            --primary-dark: #0097a7;
            --primary-glow: rgba(0, 229, 255, 0.25);
            --neon-purple: #b388ff;
            --success: #00e676;
            --danger: #ff5252;
            --warning: #ffd740;
            --bg: #0a0e1a;
            --card-bg: rgba(16, 22, 40, 0.85);
            --card-border: rgba(0, 229, 255, 0.15);
            --sidebar-bg: rgba(8, 12, 24, 0.95);
            --sidebar-active: rgba(0, 229, 255, 0.15);
            --sidebar-hover: rgba(0, 229, 255, 0.08);
            --text: #e0f7ff;
            --text-secondary: #8899b4;
            --text-light: #5a6a84;
            --border: rgba(0, 229, 255, 0.2);
            --shadow: 0 0 15px rgba(0, 229, 255, 0.08);
            --shadow-glow: 0 0 20px rgba(0, 229, 255, 0.2);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
            overflow: hidden;
        }
        /* Particle Canvas */
        #particleCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        body > * { position: relative; z-index: 1; }
        /* =================== Sidebar (Sci-Fi) =================== */
        .sidebar {
            width: 56px;
            min-width: 56px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--card-border);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 14px 0;
            transition: width .35s cubic-bezier(.4,0,.2,1), min-width .35s ease;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }
        .sidebar::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 1px; height: 100%;
            background: var(--card-border);
            opacity: 1;
        }
        .sidebar.expanded {
            width: 200px;
            min-width: 200px;
        }
        .sidebar-logo {
            padding: 0 14px 14px;
            font-size: .85rem;
            font-weight: 700;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            letter-spacing: 1px;
        }
        .sidebar-logo .logo-icon {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, var(--primary), var(--neon-purple));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .9rem;
            flex-shrink: 0;
            box-shadow: 0 0 10px var(--primary-glow);
        }
        .sidebar-logo .logo-text { opacity: 0; transition: opacity .25s ease 0s; }
        .sidebar.expanded .sidebar-logo .logo-text { opacity: 1; transition-delay: .1s; }
        .sidebar-toggle {
            position: absolute;
            top: 10px;
            right: -12px;
            width: 24px;
            height: 24px;
            background: var(--bg);
            border: 1px solid var(--primary);
            color: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            font-size: .7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all .2s;
            padding: 0;
        }
        .sidebar-toggle:hover {
            background: var(--primary);
            color: var(--bg);
            box-shadow: 0 0 12px var(--primary-glow);
        }
        .sidebar.expanded .sidebar-toggle { transform: rotate(180deg); }
        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0 6px;
        }
        .nav-item {
            padding: 10px 8px;
            cursor: pointer;
            transition: all .25s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: .8rem;
            color: var(--text-secondary);
            border-radius: 6px;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }
        .nav-item::before {
            content: '';
            position: absolute;
            left: 0; top: 50%;
            height: 0; width: 2px;
            background: var(--primary);
            border-radius: 2px;
            transition: height .25s;
            transform: translateY(-50%);
        }
        .nav-item:hover {
            background: var(--sidebar-hover);
            color: var(--primary);
        }
        .nav-item.active {
            background: var(--sidebar-active);
            color: var(--primary);
            box-shadow: inset 2px 0 0 var(--primary);
        }
        .nav-item.active::before { height: 60%; }
        .nav-item .nav-label {
            opacity: 0;
            transition: opacity .25s ease .05s;
        }
        .sidebar.expanded .nav-item .nav-label { opacity: 1; }
        .nav-icon {
            font-size: 1rem;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
            filter: drop-shadow(0 0 3px currentColor);
        }
        .sidebar-footer {
            padding: 10px 6px;
            border-top: 1px solid var(--card-border);
            margin-top: auto;
            display: flex;
            justify-content: center;
        }
        .sidebar.expanded .sidebar-footer { justify-content: space-between; align-items: center; }
        .sidebar-footer { gap: 6px; }
        .theme-toggle {
            background: transparent;
            border: 1px solid var(--card-border);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all .2s;
            padding: 0;
            flex-shrink: 0;
        }
        .theme-toggle:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }
        .sidebar:not(.expanded) .sidebar-footer { justify-content: center; gap: 0; }
        .sidebar:not(.expanded) .status-badge { display: none; }
        .sidebar:not(.expanded) .theme-toggle { margin: 0 auto; }
        .status-badge {
            font-size: .7rem;
            padding: 3px 10px;
            border-radius: 12px;
            background: var(--sidebar-hover);
            border: 1px solid var(--card-border);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
        }
        .status-badge .status-label { opacity: 0; transition: opacity .25s ease .05s; }
        .sidebar.expanded .status-badge .status-label { opacity: 1; }
        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--danger);
            box-shadow: 0 0 4px currentColor;
            animation: pulse-dot 2s infinite;
        }
        .status-dot.connected { background: var(--success); }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        /* =================== Main =================== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }
        .main-header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            padding: 12px 24px;
            border-bottom: 1px solid var(--card-border);
            flex-shrink: 0;
        }
        .main-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--primary-glow);
        }
        .main-content {
            flex: 1;
            overflow: hidden;
            padding: 20px 24px;
            min-height: 0;
            min-width: 0;
        }
        /* =================== Panels =================== */
        .panel { display: none; }
        .panel.active {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }
        .panel.active > .card {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }
        .panel.active > .card > .file-table-area {
            flex: 1;
            min-height: 120px;
        }
        .panel.active > .card > .pagination {
            flex-shrink: 0;
        }
        /* =================== Card (Sci-Fi) =================== */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px;
            margin-bottom: 14px;
            position: relative;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 20px; height: 20px;
            border-top: 2px solid var(--primary);
            border-left: 2px solid var(--primary);
            border-radius: var(--radius) 0 0 0;
            pointer-events: none;
        }
        .card::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 20px; height: 20px;
            border-bottom: 2px solid var(--primary);
            border-right: 2px solid var(--primary);
            border-radius: 0 0 var(--radius) 0;
            pointer-events: none;
        }
        .card-title {
            font-size: .95rem;
            font-weight: 600;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            letter-spacing: .5px;
        }
        /* =================== Forms (Sci-Fi) =================== */
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: .8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: .5px;
            text-transform: uppercase;
        }
        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            font-size: .85rem;
            outline: none;
            background: var(--card-bg);
            color: var(--text);
            transition: all .2s;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
            background: var(--card-bg);
        }
        .form-control::placeholder { color: var(--text-light); }
        select.form-control option { background: var(--card-bg); color: var(--text); }
        /* =================== Buttons (Sci-Fi) =================== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1px solid transparent;
            border-radius: var(--radius);
            font-size: .82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all .2s;
            letter-spacing: .5px;
            position: relative;
            overflow: hidden;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.1), transparent);
            transition: left .5s;
        }
        .btn:hover:not(:disabled)::before { left: 100%; }
        .btn:disabled { opacity: .4; cursor: not-allowed; }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: #001a1f;
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--primary), var(--neon-purple));
            box-shadow: 0 0 18px var(--primary-glow);
        }
        .btn-success {
            background: linear-gradient(135deg, #00c853, var(--success));
            color: #002010;
            box-shadow: 0 0 10px rgba(0, 230, 118, .3);
        }
        .btn-danger {
            background: linear-gradient(135deg, #d50000, var(--danger));
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 82, 82, .3);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover:not(:disabled) {
            background: var(--primary-glow);
        }
        .btn-sm { padding: 5px 10px; font-size: .78rem; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        /* 查询按钮高度统一 */
        .btn-height-match { height: 36px; }
        /* =================== Path Bar =================== */
        .path-bar {
            background: #f0f6ff;
            border: 1px solid #d3e3f7;
            border-radius: var(--radius);
            padding: 8px 14px;
            margin-bottom: 14px;
            font-size: .85rem;
            color: #3a5f8a;
        }
        .path-bar b { color: var(--primary); font-weight: 600; }
        /* =================== Upload Zone =================== */
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all .2s;
            background: #fafbfc;
        }
        .upload-zone:hover { border-color: var(--primary); background: rgba(66,133,244,.04); }
        .upload-zone .upload-icon { font-size: 2rem; margin-bottom: 10px; }
        .upload-zone p { color: var(--text-secondary); font-size: .85rem; }
        /* =================== Progress =================== */
        .progress-bar-container {
            background: #e8eaed;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin: 10px 0;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #6c63ff);
            border-radius: 10px;
            transition: width .3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .7rem;
            font-weight: 600;
            color: white;
            min-width: 35px;
        }
        /* =================== Path Bar (Sci-Fi) =================== */
        .path-bar {
            background: var(--sidebar-hover);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 8px 14px;
            margin-bottom: 14px;
            font-size: .82rem;
            color: var(--text-secondary);
            font-family: "Consolas", "Monaco", monospace;
        }
        .path-bar b { color: var(--primary); font-weight: 600; text-shadow: 0 0 8px var(--primary-glow); }
        /* =================== Upload Zone (Sci-Fi) =================== */
        .upload-zone {
            border: 2px dashed var(--card-border);
            border-radius: var(--radius);
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all .25s;
            background: var(--bg);
        }
        .upload-zone:hover {
            border-color: var(--primary);
            background: var(--sidebar-hover);
            box-shadow: var(--shadow-glow);
        }
        .upload-zone .upload-icon { font-size: 2rem; margin-bottom: 10px; filter: drop-shadow(0 0 8px var(--primary-glow)); }
        .upload-zone p { color: var(--text-secondary); font-size: .85rem; }
        /* =================== Progress (Sci-Fi) =================== */
        .progress-bar-container {
            background: var(--border);
            border-radius: 10px;
            height: 18px;
            overflow: hidden;
            margin: 8px 0;
            position: relative;
            border: 1px solid var(--card-border);
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--neon-purple), var(--primary));
            background-size: 200% 100%;
            animation: progress-shine 2s linear infinite;
            border-radius: 10px;
            transition: width .3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .7rem;
            font-weight: 600;
            color: #001a1f;
            min-width: 35px;
            box-shadow: 0 0 10px var(--primary-glow);
        }
        @keyframes progress-shine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        /* =================== File Table (Sci-Fi) =================== */
        .file-table-area {
            flex: 1;
            min-height: 120px;
            max-height: none;
            overflow-y: auto;
            overflow-x: hidden;
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            background: var(--card-bg);
        }
        .file-table-area::-webkit-scrollbar { width: 8px; }
        .file-table-area::-webkit-scrollbar-track { background: transparent; }
        .file-table-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .file-table-area::-webkit-scrollbar-thumb:hover { background: var(--primary); }
        .file-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .82rem;
        }
        .file-table th {
            position: sticky;
            top: 0;
            text-align: left;
            padding: 8px 10px;
            background: var(--bg);
            font-weight: 600;
            font-size: .78rem;
            color: var(--primary);
            border-bottom: 1px solid var(--card-border);
            z-index: 1;
            letter-spacing: .5px;
        }
        .file-table td {
            padding: 7px 10px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }
        .file-table tr:hover td { background: var(--sidebar-hover); }
        .file-table .actions { white-space: nowrap; }
        .file-name {
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 400px;
            overflow: hidden;
        }
        .file-name .file-icon { font-size: 1.1rem; flex-shrink: 0; }
        .file-name .name-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* =================== Search =================== */
        .search-bar { display: flex; gap: 8px; align-items: center; }
        .search-bar .form-control { flex: 1; }
        .search-type-group { display: flex; gap: 4px; }
        .search-type-btn {
            padding: 5px 10px;
            border: 1px solid var(--border);
            background: white;
            border-radius: var(--radius);
            font-size: .8rem;
            cursor: pointer;
        }
        .search-type-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        /* =================== Pagination =================== */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-top: 1px solid var(--border);
            margin-top: 12px;
        }
        .pagination-info { font-size: .85rem; color: var(--text-secondary); }
        .pagination-controls { display: flex; gap: 4px; align-items: center; }
        .pagination-btn {
            padding: 5px 10px;
            border: 1px solid var(--border);
            background: white;
            border-radius: var(--radius);
            font-size: .8rem;
            cursor: pointer;
        }
        .pagination-btn:hover:not(:disabled) { background: var(--bg); }
        .pagination-btn:disabled { opacity: .5; cursor: not-allowed; }
        /* =================== Alert =================== */
        .alert {
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: .85rem;
            margin-bottom: 14px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .alert.show { display: flex; }
        .alert-success { background: #e6f4ea; color: #1e7e34; border: 1px solid #b7e1c3; }
        .alert-error { background: #fce8e6; color: #c5221f; border: 1px solid #f5b6b3; }
        .alert-info { background: #e8f0fe; color: #1967d2; border: 1px solid #a8c7fa; }
        /* Toast Notification */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: var(--radius);
            font-size: .9rem;
            color: white;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            animation: toastIn .3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 400px;
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--primary); }
        @keyframes toastIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        /* =================== Bottom Progress =================== */
        .bottom-progress {
            position: fixed;
            bottom: 0;
            left: 56px;
            right: 0;
            background: white;
            border-top: 1px solid var(--border);
            padding: 8px 24px;
            z-index: 100;
            display: none;
            box-shadow: 0 -2px 8px rgba(0,0,0,.1);
        }
        .bottom-progress.show { display: block; }
        .bottom-progress .progress-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: .85rem;
            margin-bottom: 4px;
        }
        .bottom-progress .progress-bar-container {
            margin: 0;
            height: 16px;
        }
        /* =================== Empty State =================== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }
        .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
        /* =================== Folder Browser =================== */
        .folder-browser {
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 6px 8px;
            margin-top: 6px;
            max-width: 620px;
        }
        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 5px;
            max-height: 180px;
            min-height: 40px;
            overflow-y: auto;
            overflow-x: hidden;
            align-content: start;
        }
        .folder-grid::-webkit-scrollbar { width: 6px; }
        .folder-grid::-webkit-scrollbar-track { background: transparent; }
        .folder-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .folder-grid::-webkit-scrollbar-thumb:hover { background: var(--primary); }
        .folder-card {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--sidebar-hover);
            border: 1px solid var(--card-border);
            color: var(--text);
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: .78rem;
            min-height: 28px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            transition: all .2s;
        }
        .folder-card:hover { border-color: var(--primary); background: var(--sidebar-active); box-shadow: var(--shadow-glow); }
        .folder-card .folder-icon { font-size: 1.1rem; flex-shrink: 0; }
        /* =================== Breadcrumb =================== */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 0;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .breadcrumb-item {
            font-size: .85rem;
            color: var(--primary);
            cursor: pointer;
        }
        .breadcrumb-item:hover { text-decoration: underline; }
        .breadcrumb-item.active { color: var(--text); cursor: default; font-weight: 600; }
        .breadcrumb-sep { color: var(--text-secondary); font-size: .75rem; }
        /* =================== Checkbox =================== */
        .file-checkbox {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }
        .select-all-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .selected-count {
            font-size: .85rem;
            color: var(--primary);
            font-weight: 600;
        }
        .hidden { display: none !important; }
        .spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 2px solid rgba(66,133,244,.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* =================== Upload File List =================== */
        .upload-file-list { margin-top: 14px; }
        .upload-file-item {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 4px;
            gap: 8px;
            font-size: .85rem;
        }
        .upload-file-item .file-info { flex: 1; min-width: 0; overflow: hidden; }
        .upload-file-item .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .upload-file-item .file-size { color: var(--text-secondary); font-size: .8rem; flex-shrink: 0; }
        .upload-file-item .remove-btn {
            cursor: pointer;
            color: var(--danger);
            font-size: 1.1rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="展开">&#9654;</button>
        <div class="sidebar-logo">
            <div class="logo-icon">&#9881;</div>
            <span class="logo-text">MINIO 云存储</span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-item active" data-panel="config">
                <span class="nav-icon">&#9881;</span> 连接配置
            </div>
            <div class="nav-item" data-panel="upload">
                <span class="nav-icon">&#8679;</span> 文件上传
            </div>
            <div class="nav-item" data-panel="download">
                <span class="nav-icon">&#8681;</span> 文件下载
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-label" id="statusText">未连接</span>
            </div>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题">
                <span class="theme-icon" id="themeIcon">&#9788;</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <!-- Header -->
        <div class="main-header">
            <h2 id="pageTitle">连接配置</h2>
        </div>

        <!-- Content Area -->
        <div class="main-content">
            <!-- Alert -->
            <div class="alert alert-success" id="alertSuccess"><span id="alertSuccessText"></span></div>
            <div class="alert alert-error" id="alertError"><span id="alertErrorText"></span></div>
            <div class="alert alert-info" id="alertInfo"><span id="alertInfoText"></span></div>

            <!-- Config Panel -->
            <div class="panel active" id="panel-config">
                <div class="card">
                    <div class="card-title"><span class="icon">&#9881;</span> MinIO 连接设置</div>
                    <div class="form-group">
                        <label>服务器地址 (含端口和路径)</label>
                        <input type="text" class="form-control" id="serverAddress" placeholder="例: 10.204.184.236:8109/minio-api/">
                    </div>
                    <div class="form-group">
                        <label>Access Key</label>
                        <input type="text" class="form-control" id="accessKey" placeholder="MinIO Access Key">
                    </div>
                    <div class="form-group">
                        <label>Secret Key</label>
                        <input type="password" class="form-control" id="secretKey" placeholder="MinIO Secret Key">
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="saveConfig()">保存并连接</button>
                        <button class="btn btn-outline" onclick="testConnection()">测试连接</button>
                    </div>
                </div>
                <div class="card" id="bucketsCard" style="display:none">
                    <div class="card-title"><span class="icon">&#128451;</span> 已连接桶列表</div>
                    <div id="bucketsList"></div>
                </div>
            </div>

            <!-- Upload Panel -->
            <div class="panel" id="panel-upload">
                <div class="card">
                    <div class="card-title"><span class="icon">&#8679;</span> 文件上传</div>
                    <!-- Path Bar -->
                    <div class="path-bar" id="uploadPathBar">当前路径: <b>未选择桶</b></div>
                    <!-- Bucket Selection -->
                    <div class="form-group">
                        <label>选择目标桶</label>
                        <select class="form-control" id="uploadBucket" onchange="onUploadBucketChange()">
                            <option value="">-- 选择桶 --</option>
                        </select>
                    </div>
                    <!-- Folder Browser -->
                    <div class="folder-browser hidden" id="uploadFolderBrowser">
                        <div class="breadcrumb" id="uploadBreadcrumb"></div>
                        <div class="folder-grid" id="uploadFolderGrid"></div>
                    </div>
                    <!-- 浏览文件夹按钮已移除, 选择桶后自动显示 -->
                    <!-- Drop Zone -->
                    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('multiFileInput').click()">
                        <div class="upload-icon">&#128196;</div>
                        <p><strong>拖拽文件到此处</strong> 或 点击选择文件</p>
                        <input type="file" id="multiFileInput" class="hidden" multiple onchange="handleMultiFileSelect(this)">
                    </div>
                    <!-- File List -->
                    <div id="uploadFileList" class="upload-file-list hidden">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                            <strong>待上传文件 (<span id="uploadFileCount">0</span>)</strong>
                            <div class="btn-group">
                                <button class="btn btn-sm btn-outline" onclick="clearUploadList()">清空列表</button>
                                <button class="btn btn-sm btn-success" id="batchUploadBtn" onclick="batchUpload()">&#11015; 批量上传</button>
                            </div>
                        </div>
                        <div id="uploadFileItems"></div>
                    </div>
                    <!-- Progress -->
                    <div id="uploadProgress" style="display:none">
                        <div class="progress-info">
                            <span id="uploadProgressText">准备上传...</span>
                            <span id="uploadProgressPercent">0%</span>
                        </div>
                        <div class="progress-bar-container">
                            <div class="progress-bar" id="uploadProgressBar" style="width:0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Download Panel -->
            <div class="panel" id="panel-download">
                <div class="card">
                    <div class="card-title"><span class="icon">&#8681;</span> 文件下载</div>
                    <!-- Path Bar -->
                    <div class="path-bar" id="downloadPathBar">当前路径: <b>未选择桶</b></div>
                    <!-- Bucket Selection -->
                    <div class="form-group" style="display:flex;gap:8px;align-items:end">
                        <div style="flex:1">
                            <label>选择桶</label>
                            <select class="form-control" id="downloadBucket" onchange="onDownloadBucketChange()">
                                <option value="">-- 选择桶 --</option>
                            </select>
                        </div>
                        <div style="flex:2">
                            <label>搜索文件</label>
                            <div class="search-bar">
                                <input type="text" class="form-control" id="downloadSearchInput" placeholder="输入文件名搜索...">
                                <div class="search-type-group">
                                    <button class="search-type-btn active" data-type="contains" onclick="setDownloadSearchType('contains')">包含</button>
                                    <button class="search-type-btn" data-type="regex" onclick="setDownloadSearchType('regex')">正则</button>
                                </div>
                            </div>
                        </div>
                        <button class="btn btn-primary btn-height-match" style="margin-bottom:0" onclick="loadDownloadFiles()">&#128269; 查询</button>
                    </div>
                    <!-- Folder Browser -->
                    <div class="folder-browser hidden" id="downloadFolderBrowser">
                        <div class="breadcrumb" id="downloadBreadcrumb"></div>
                        <div class="folder-grid" id="downloadFolderGrid"></div>
                    </div>
                    <!-- 浏览文件夹按钮已移除, 选择桶后自动显示 -->
                    <!-- Select All Bar -->
                    <div class="select-all-bar hidden" id="downloadSelectAllBar">
                        <label class="form-check">
                            <input type="checkbox" class="file-checkbox" id="downloadSelectAllCheckbox" onchange="toggleDownloadSelectAll()"> 全选
                        </label>
                        <span class="selected-count" id="downloadSelectedCount">已选择 0 个文件</span>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-danger" onclick="batchDeleteSelected()">&#128465; 删除所选</button>
                            <button class="btn btn-sm btn-primary btn-height-match" onclick="batchDownloadSelected()">&#128230; 批量下载</button>
                        </div>
                    </div>
                    <!-- File List -->
                    <div class="file-table-area" id="downloadFileListArea">
                        <div class="empty-state"><div class="empty-icon">&#128194;</div><p>选择桶后点击查询查看文件列表</p></div>
                    </div>
                    <!-- Pagination -->
                    <div class="pagination" id="downloadPagination" style="display:none">
                        <div class="pagination-info" id="downloadPaginationInfo"></div>
                        <div class="pagination-controls">
                            <span style="font-size:.85rem;color:var(--text-secondary)">每页</span>
                            <select class="form-control" id="downloadPageSize" onchange="onDownloadPageSizeChange()" style="width:80px;display:inline;padding:4px 8px">
                                <option value="10" selected>10</option>
                                <option value="20">20</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                            <span style="font-size:.85rem;color:var(--text-secondary)">条</span>
                            <button class="pagination-btn" id="downloadPageFirst" onclick="goDownloadPage(1)">&#8810;</button>
                            <button class="pagination-btn" id="downloadPagePrev" onclick="goDownloadPage(currentDownloadPage - 1)">&#8811;</button>
                            <span id="downloadPageNum" style="font-size:.85rem;min-width:60px;text-align:center"></span>
                            <button class="pagination-btn" id="downloadPageNext" onclick="goDownloadPage(currentDownloadPage + 1)">&#8812;</button>
                            <button class="pagination-btn" id="downloadPageLast" onclick="goDownloadPage(totalDownloadPages)">&#8811;</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Progress Bar -->
    <div class="bottom-progress" id="bottomProgress">
        <div class="progress-info">
            <span id="progressText">准备中...</span>
            <div style="display:flex;gap:8px;align-items:center">
                <span id="progressPercent">0%</span>
                <button class="btn btn-sm btn-danger" id="cancelProgressBtn" onclick="cancelCurrentTransfer()" style="padding:2px 10px;font-size:.75rem;display:none">&#10005; 取消</button>
            </div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="bottomProgressBar" style="width:0%"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
    // =================== State ===================
    var allDownloadFiles = [];
    var selectedDownloadFiles = {};
    var downloadCurrentPrefix = '';
    var uploadCurrentPrefix = '';
    var downloadCurrentSearch = '';
    var downloadCurrentTotal = 0;
    var currentDownloadPage = 1;
    var downloadPageSize = 10;
    var totalDownloadPages = 1;
    var currentDownloadSearchType = 'contains';
    var uploadFiles = [];
    var activeDownloads = {};
    var uploadId = '';
    var progressTimer = null;
    // For cancel support
    var currentUploadXhr = null;
    var currentDownloadXhr = null;
    var currentTransferType = null; // 'upload' | 'download' | null

    // =================== Tab Navigation ===================
    document.querySelectorAll('.nav-item').forEach(function(item) {
        item.addEventListener('click', function() {
            document.querySelectorAll('.nav-item').forEach(function(el) { el.classList.remove('active'); });
            this.classList.add('active');
            var panel = this.getAttribute('data-panel');
            document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
            document.getElementById('panel-' + panel).classList.add('active');
            document.getElementById('pageTitle').textContent = this.textContent.trim();
        });
    });

    // =================== Sidebar Toggle ===================
    function toggleSidebar() {
        var sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('expanded');
        var isExpanded = sidebar.classList.contains('expanded');
        var toggle = document.getElementById('sidebarToggle');
        if (toggle) toggle.title = isExpanded ? '收缩' : '展开';
        var progress = document.getElementById('bottomProgress');
        if (progress) {
            progress.style.left = isExpanded ? '200px' : '56px';
        }
    }

    // =================== API Request ===================
    function apiRequest(method, url, data, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open(method, '/minio/api' + url, true);
        xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.timeout = 60000;
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                try {
                    var resp = JSON.parse(xhr.responseText);
                    if (xhr.status === 200) callback(null, resp);
                    else callback(resp.error || 'Request failed: ' + xhr.status, null);
                } catch(e) { callback('JSON parse error', null); }
            }
        };
        xhr.onerror = function() { callback('Network error', null); };
        xhr.ontimeout = function() { callback('Request timeout', null); };
        if (data) xhr.send(JSON.stringify(data)); else xhr.send();
    }

    // =================== Utility ===================
    function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

    function escapeAttr(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/\\/g, '&#92;');
    }

    function formatSize(bytes) {
        if (!bytes || bytes === 0) return '0 B';
        var k = 1024;
        var sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        var i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function fileBasename(path) {
        if (!path) return '';
        var parts = path.replace(/\/+$/, '').split('/');
        return parts[parts.length - 1] || '';
    }

    function getFileIcon(filename) {
        if (!filename) return '&#128196;';
        var ext = filename.split('.').pop().toLowerCase();
        var map = {
            'pdf': '&#128230;', 'doc': '&#128196;', 'docx': '&#128196;',
            'xls': '&#128202;', 'xlsx': '&#128202;', 'csv': '&#128202;',
            'jpg': '&#127748;', 'jpeg': '&#127748;', 'png': '&#127748;', 'gif': '&#127748;', 'bmp': '&#127748;', 'svg': '&#127748;',
            'mp4': '&#127916;', 'avi': '&#127916;', 'mkv': '&#127916;', 'mov': '&#127916;',
            'mp3': '&#127925;', 'wav': '&#127925;', 'flac': '&#127925;',
            'zip': '&#128230;', 'rar': '&#128230;', '7z': '&#128230;', 'tar': '&#128230;', 'gz': '&#128230;',
            'txt': '&#128196;', 'md': '&#128196;',
            'js': '&#128187;', 'py': '&#128187;', 'java': '&#128187;', 'html': '&#128187;', 'css': '&#128187;'
        };
        return map[ext] || '&#128196;';
    }

    // =================== Toast Notification ===================
    function showToast(type, message) {
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'toast ' + type;
        var icons = { success: '&#10003;', error: '&#10007;', info: '&#8505;' };
        toast.innerHTML = '<span>' + (icons[type] || '') + '</span><span>' + escapeHtml(message) + '</span>';
        container.appendChild(toast);
        setTimeout(function() {
            toast.style.animation = 'toastIn .3s ease reverse';
            setTimeout(function() { toast.remove(); }, 300);
        }, 3000);
    }
    // Keep showAlert for backward compatibility but redirect to toast
    function showAlert(type, message) {
        showToast(type, message);
    }

    // =================== Connection Status ===================
    function updateConnectionStatus(connected) {
        var dot = document.getElementById('statusDot');
        var text = document.getElementById('statusText');
        dot.classList.toggle('connected', connected);
        text.textContent = connected ? '已连接' : '未连接';
    }

    // =================== Config ===================
    function getConfigFromForm() {
        return {
            server_address: document.getElementById('serverAddress').value.trim(),
            access_key: document.getElementById('accessKey').value.trim(),
            secret_key: document.getElementById('secretKey').value.trim()
        };
    }

    function saveConfig() {
        var config = getConfigFromForm();
        if (!config.server_address || !config.access_key || !config.secret_key) {
            showAlert('error', '请填写完整的连接信息');
            return;
        }
        apiRequest('POST', '/config', config, function(err, resp) {
            if (err) { showAlert('error', '连接失败: ' + err); updateConnectionStatus(false); }
            else { showAlert('success', resp.message || '连接成功！'); updateConnectionStatus(true); refreshBuckets(); }
        });
    }

    function testConnection() { saveConfig(); }

    // =================== Load Config ===================
    function loadConfig() {
        apiRequest('GET', '/config', null, function(err, resp) {
            if (!err && resp.server_address) {
                document.getElementById('serverAddress').value = resp.server_address || '';
                document.getElementById('accessKey').value = resp.access_key || '';
                document.getElementById('secretKey').value = resp.secret_key || '';
                updateConnectionStatus(resp.connected || false);
                if (resp.connected) refreshBuckets();
            }
        });
    }

    // =================== Buckets ===================
    function refreshBuckets() {
        apiRequest('GET', '/buckets', null, function(err, resp) {
            if (err) return;
            var buckets = resp.buckets || [];
            var html = buckets.map(function(b) {
                return '<div style="padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer" onclick="this.style.background=\'#f0f6ff\'">' +
                    '<strong>' + escapeHtml(b.name) + '</strong> <span style="color:var(--text-secondary);font-size:.8rem">' + (b.creation_date || '') + '</span></div>';
            }).join('');
            document.getElementById('bucketsList').innerHTML = html || '<p style="color:var(--text-secondary)">无桶</p>';
            document.getElementById('bucketsCard').style.display = 'block';
            // Update bucket dropdowns
            var options = '<option value="">-- 选择桶 --</option>';
            buckets.forEach(function(b) { options += '<option value="' + escapeAttr(b.name) + '">' + escapeHtml(b.name) + '</option>'; });
            document.getElementById('uploadBucket').innerHTML = options;
            document.getElementById('downloadBucket').innerHTML = options;
            // Restore last selections
            var lastUpload = localStorage.getItem('last_upload_bucket');
            var lastDownload = localStorage.getItem('last_download_bucket');
            if (lastUpload && buckets.find(function(b) { return b.name === lastUpload; }))
                document.getElementById('uploadBucket').value = lastUpload;
            if (lastDownload && buckets.find(function(b) { return b.name === lastDownload; })) {
                document.getElementById('downloadBucket').value = lastDownload;
            }
        });
    }

    // =================== Upload ===================
    function onUploadBucketChange() {
        var bucket = document.getElementById('uploadBucket').value;
        localStorage.setItem('last_upload_bucket', bucket);
        uploadCurrentPrefix = localStorage.getItem('upload_prefix') || '';
        updateUploadPathBar();
        document.getElementById('uploadFolderBrowser').classList.add('hidden');
        // uploadBrowseBtn removed - folders auto load
    }

    function updateUploadPathBar() {
        var bucket = document.getElementById('uploadBucket').value;
        var path = uploadCurrentPrefix || '';
        var full = bucket ? (bucket + (path ? '/' + path : '')) : '未选择桶';
        document.getElementById('uploadPathBar').innerHTML = '当前路径: <b>' + escapeHtml(full) + '</b>';
    }

    function openUploadFolderBrowser() {
        document.getElementById('uploadFolderBrowser').classList.remove('hidden');
        loadUploadFolders();
    }

    function loadUploadFolders() {
        var bucket = document.getElementById('uploadBucket').value;
        if (!bucket) return;
        var prefix = uploadCurrentPrefix || '';
        apiRequest('GET', '/folders?bucket=' + encodeURIComponent(bucket) + '&prefix=' + encodeURIComponent(prefix), null, function(err, resp) {
            if (err) { showAlert('error', err); return; }
            renderUploadFolders(resp.folders || [], bucket, prefix);
        });
    }

    function renderUploadFolders(folders, bucket, prefix) {
        // Breadcrumb
        var parts = prefix ? prefix.split('/').filter(Boolean) : [];
        var bcHtml = '<span class="breadcrumb-item ' + (parts.length === 0 ? 'active' : '') + '" onclick="navigateUploadBreadcrumb(undefined)">' + escapeHtml(bucket) + '</span>';
        parts.forEach(function(p, i) {
            var path = parts.slice(0, i + 1).join('/');
            var isLast = (i === parts.length - 1);
            bcHtml += '<span class="breadcrumb-sep">/</span>';
            bcHtml += '<span class="breadcrumb-item ' + (isLast ? 'active' : '') + '" onclick="navigateUploadBreadcrumb(\'' + escapeAttr(path) + '\')">' + escapeHtml(p) + '</span>';
        });
        document.getElementById('uploadBreadcrumb').innerHTML = bcHtml;
        // Grid
        var gridHtml = folders.map(function(f) {
            return '<div class="folder-card" data-folder="' + escapeAttr(f) + '">' +
                '<span class="folder-icon">&#128193;</span>' + escapeHtml(fileBasename(f)) + '</div>';
        }).join('');
        document.getElementById('uploadFolderGrid').innerHTML = gridHtml || '<p style="color:var(--text-secondary);font-size:.85rem">无子文件夹</p>';
        // Click handler
        document.querySelectorAll('#uploadFolderGrid .folder-card').forEach(function(card) {
            card.addEventListener('click', function() {
                var folder = this.getAttribute('data-folder');
                enterUploadFolder(folder);
            });
        });
    }

    function batchUpload() {
        if (!uploadFiles.length) { showAlert('error', '请先选择文件'); return; }
        var bucket = document.getElementById('uploadBucket').value;
        if (!bucket) { showAlert('error', '请先选择目标桶'); return; }
        document.getElementById('batchUploadBtn').disabled = true;
        showBottomProgress('准备上传...', 0);
        var currentFile = 0;
        var prefix = uploadCurrentPrefix || '';

        function uploadNext() {
            if (currentFile >= uploadFiles.length) {
                showBottomProgress('上传完成！', 100);
                showAlert('success', '全部文件上传成功！');
                document.getElementById('batchUploadBtn').disabled = false;
                setTimeout(function() { hideBottomProgress(); }, 2000);
                return;
            }
            var file = uploadFiles[currentFile];
            var pct = Math.round((currentFile / uploadFiles.length) * 100);
            showBottomProgress('上传中: ' + file.name + ' (' + (currentFile + 1) + '/' + uploadFiles.length + ')', pct);

            var formData = new FormData();
            formData.append('file', file);
            formData.append('bucket', bucket);
            formData.append('upload_id', 'upload-' + Date.now());
            var uploadPath = prefix ? prefix + '/' + file.name : file.name;
            formData.append('custom_name', uploadPath);

            var xhr = new XMLHttpRequest();
            currentUploadXhr = xhr;
            currentTransferType = 'upload';
            showCancelBtn();
            xhr.open('POST', '/minio/api/upload', true);
            xhr.upload.addEventListener('progress', function(e) {
                if (e.lengthComputable) {
                    var filePct = Math.round((e.loaded / e.total) * 100);
                    var totalPct = Math.round(((currentFile + filePct / 100) / uploadFiles.length) * 100);
                    showBottomProgress('上传中: ' + file.name + ' (' + (currentFile + 1) + '/' + uploadFiles.length + ') ' + filePct + '%', totalPct);
                }
            });
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    currentUploadXhr = null;
                    currentTransferType = null;
                    if (xhr.status === 0 && xhr.responseText === '') {
                        // Aborted (user cancelled)
                        return;
                    }
                    try {
                        var resp = JSON.parse(xhr.responseText);
                        if (xhr.status === 200) {
                            currentFile++;
                            uploadNext();
                        } else {
                            showAlert('error', '上传失败: ' + (resp.error || '未知错误'));
                            document.getElementById('batchUploadBtn').disabled = false;
                            hideBottomProgress();
                        }
                    } catch(e) {
                        showAlert('error', '上传失败: ' + e.message);
                        document.getElementById('batchUploadBtn').disabled = false;
                        hideBottomProgress();
                    }
                }
            };
            xhr.send(formData);
        }
        uploadNext();
    }

    function loadDownloadFiles() {
        var bucket = document.getElementById('downloadBucket').value;

        var searchInput = document.getElementById('downloadSearchInput');
        var pattern = searchInput ? searchInput.value.trim() : '';

        updateDownloadPathBar();
        currentDownloadPage = 1;
        var hasSearch = !!pattern;
        var query = '?bucket=' + encodeURIComponent(bucket);
        if (prefix) query += '&prefix=' + encodeURIComponent(prefix);
        query += '&offset=' + ((currentDownloadPage - 1) * downloadPageSize);
        query += '&limit=' + downloadPageSize;
        document.getElementById('downloadFileListArea').innerHTML = '<div class="empty-state"><div class="spinner"></div><p style="margin-top:12px">加载中...</p></div>';
        document.getElementById('downloadPagination').style.display = 'none';
        var url;
        if (hasSearch) {
            query = '?bucket=' + encodeURIComponent(bucket) + '&pattern=' + encodeURIComponent(pattern) + '&type=' + currentDownloadSearchType;
            if (prefix) query += '&prefix=' + encodeURIComponent(prefix);
            url = '/search' + query;
        } else {
            url = '/files' + query;
        }
        apiRequest('GET', url, null, function(err, resp) {
            if (err) {
                showAlert('error', '获取文件列表失败: ' + err);
                document.getElementById('downloadFileListArea').innerHTML = '<div class="empty-state"><div class="empty-icon">&#9888;</div><p>加载失败</p></div>';
                document.getElementById('downloadSelectAllBar').classList.add('hidden');
                allDownloadFiles = []; selectedDownloadFiles = {};
                return;
            }
            allDownloadFiles = resp.files || [];
            selectedDownloadFiles = {};
            downloadCurrentTotal = resp.total_collected || allDownloadFiles.length;
            if (allDownloadFiles.length === 0) {
                document.getElementById('downloadFileListArea').innerHTML = '<div class="empty-state"><div class="empty-icon">&#128194;</div><p>该目录暂无文件</p></div>';
                document.getElementById('downloadSelectAllBar').classList.add('hidden');
                document.getElementById('downloadPagination').style.display = 'none';
                return;
            }
            totalDownloadPages = Math.max(1, Math.ceil(downloadCurrentTotal / downloadPageSize));
            document.getElementById('downloadSelectAllBar').classList.remove('hidden');
            renderDownloadFileTable(allDownloadFiles, bucket);
            renderPagination();
        });

    function copyFileName(name) {
        function fallbackCopy() {
            var ta = document.createElement('textarea');
            ta.value = name;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            var ok = false;
            try { ok = document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
            return ok;
        }
        function finish(ok) {
            if (ok) showAlert('success', '已复制: ' + name);
            else showAlert('error', '复制失败，请手动选择复制');
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(name).then(
                function() { finish(true); },
                function() { finish(fallbackCopy()); }
            );
        } else {
            finish(fallbackCopy());
        }
    }

    function downloadFile(bucket, objectName) {
        var basename = fileBasename(objectName);
        var controller = new AbortController();
        currentDownloadXhr = controller;
        currentTransferType = 'download';
        showCancelBtn();
        showBottomProgress('正在下载: ' + basename, 0);
        var url = '/minio/api/download?bucket=' + encodeURIComponent(bucket) + '&object_name=' + encodeURIComponent(objectName);
        fetch(url, { signal: controller.signal })
            .then(function(resp) {
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                var total = resp.headers.get('Content-Length');
                var reader = resp.body.getReader();
                var chunks = [];
                var loaded = 0;
                function read() {
                    reader.read().then(function(r) {
                        if (r.done) {
                            var blob = new Blob(chunks);
                            var cd = resp.headers.get('Content-Disposition') || 'attachment; filename="' + basename + '"';
                            var m = cd.match(/filename="?([^";]+)"?/);
                            var fname = m ? m[1] : basename;
                            var a = document.createElement('a');
                            a.href = URL.createObjectURL(blob);
                            a.download = fname;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            showBottomProgress('下载完成: ' + basename, 100);
                            setTimeout(function() { hideBottomProgress(); }, 1500);
                            currentDownloadXhr = null;
                            currentTransferType = null;
                            return;
                        }
                        chunks.push(r.value);
                        loaded += r.value.length;
                        var pct = total ? Math.round((loaded / parseInt(total)) * 100) : Math.round(loaded / 1024 / 1024);
                        showBottomProgress('下载中: ' + basename, total ? pct + '%' : (loaded / 1024 / 1024).toFixed(1) + ' MB');
                        read();
                    }).catch(function(err) {
                        currentDownloadXhr = null;
                        currentTransferType = null;
                        if (err.name === 'AbortError') {
                            showToast('error', '下载已取消');
                            hideBottomProgress();
                        } else {
                            showToast('error', '下载失败: ' + err.message);
                            hideBottomProgress();
                        }
                    });
                }
                read();
            })
            .catch(function(err) {
                currentDownloadXhr = null;
                currentTransferType = null;
                if (err.name === 'AbortError') {
                    showToast('error', '下载已取消');
                    hideBottomProgress();
                } else {
                    showToast('error', '下载失败: ' + err.message);
                    hideBottomProgress();
                }
            });
    }

        });
    }

    // =================== Particle Background ===================
    (function() {
        var canvas = document.getElementById('particleCanvas');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var particles = [];
        var PARTICLE_COUNT = 60;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        function Particle() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.3;
            this.vy = (Math.random() - 0.5) * 0.3;
            this.r = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.5 + 0.2;
            this.hue = Math.random() > 0.5 ? 180 : 280; // cyan or purple
        }

        function init() {
            particles = [];
            for (var i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = 'hsla(' + p.hue + ', 100%, 70%, ' + p.alpha + ')';
                ctx.fill();
                // Connect nearby particles
                for (var j = i + 1; j < particles.length; j++) {
                    var q = particles[j];
                    var dx = p.x - q.x, dy = p.y - q.y;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(q.x, q.y);
                        ctx.strokeStyle = 'hsla(180, 100%, 70%, ' + (0.08 * (1 - dist / 120)) + ')';
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(draw);
        }
        init();
        draw();
    })();

    // =================== Theme Toggle ===================
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        try { localStorage.setItem('minio-theme', theme); } catch(e) {}
        var icon = document.getElementById('themeIcon');
        if (icon) icon.innerHTML = theme === 'dark' ? '&#127769;' : '&#9728;';
        var toggle = document.getElementById('themeToggle');
        if (toggle) toggle.title = theme === 'dark' ? '切换到白昼模式' : '切换到深色模式';
        var canvas = document.getElementById('particleCanvas');
        if (canvas) canvas.style.opacity = theme === 'dark' ? '1' : '0.25';
    }
    function toggleTheme() {
        var cur = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(cur === 'dark' ? 'light' : 'dark');
    }
    (function() {
        var saved = 'light';
        try { saved = localStorage.getItem('minio-theme') || 'light'; } catch(e) {}
        applyTheme(saved);
    })();

    // =================== Init ===================
    // Default sidebar collapsed
    (function() {
        var sidebar = document.getElementById('sidebar');
        if (sidebar) sidebar.classList.remove('expanded');
        var progress = document.getElementById('bottomProgress');
        if (progress) progress.style.left = '56px';
    })();
    loadConfig();
    </script>
</body>
