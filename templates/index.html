<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinIO 文件管理服务</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        :root {
            --primary: #4285f4;
            --primary-dark: #3367d6;
            --success: #34a853;
            --danger: #ea4335;
            --warning: #fbbc04;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --sidebar-bg: #1e293b;
            --sidebar-active: #334155;
            --text: #202124;
            --text-secondary: #5f6368;
            --text-light: #94a3b8;
            --border: #dadce0;
            --radius: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,.1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        /* =================== Sidebar =================== */
        .sidebar {
            width: 200px;
            min-width: 200px;
            background: var(--sidebar-bg);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }
        .sidebar-logo {
            padding: 0 20px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            border-bottom: 1px solid #334155;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .nav-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: .9rem;
            color: var(--text-light);
        }
        .nav-item:hover {
            background: var(--sidebar-active);
            color: white;
        }
        .nav-item.active {
            background: var(--primary);
            color: white;
        }
        .nav-icon { font-size: 1.1rem; width: 24px; text-align: center; }
        .sidebar-footer {
            padding: 12px 20px;
            border-top: 1px solid #334155;
            margin-top: auto;
        }
        .status-badge {
            font-size: .8rem;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,.1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--danger);
        }
        .status-dot.connected { background: var(--success); }
        /* =================== Main =================== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .main-header {
            background: white;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .main-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .main-content {
            flex: 1;
            overflow: auto;
            padding: 20px 24px;
        }
        /* =================== Panels =================== */
        .panel { display: none; }
        .panel.active { display: block; }
        /* =================== Card =================== */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* =================== Forms =================== */
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: .85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: .9rem;
            outline: none;
            background: white;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(66,133,244,.15);
        }
        /* =================== Buttons =================== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius);
            font-size: .85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all .2s;
        }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-sm { padding: 5px 10px; font-size: .8rem; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        /* =================== Path Bar =================== */
        .path-bar {
            background: #f0f6ff;
            border: 1px solid #d3e3f7;
            border-radius: var(--radius);
            padding: 8px 14px;
            margin-bottom: 14px;
            font-size: .85rem;
            color: #3a5f8a;
        }
        .path-bar b { color: var(--primary); font-weight: 600; }
        /* =================== Upload Zone =================== */
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all .2s;
            background: #fafbfc;
        }
        .upload-zone:hover { border-color: var(--primary); background: rgba(66,133,244,.04); }
        .upload-zone .upload-icon { font-size: 2rem; margin-bottom: 10px; }
        .upload-zone p { color: var(--text-secondary); font-size: .85rem; }
        /* =================== Progress =================== */
        .progress-bar-container {
            background: #e8eaed;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin: 10px 0;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #6c63ff);
            border-radius: 10px;
            transition: width .3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .7rem;
            font-weight: 600;
            color: white;
            min-width: 35px;
        }
        /* =================== File Table =================== */
        .file-table-area {
            max-height: calc(100vh - 320px);
            overflow-y: auto;
        }
        .file-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .85rem;
        }
        .file-table th {
            position: sticky;
            top: 0;
            text-align: left;
            padding: 8px 10px;
            background: var(--bg);
            font-weight: 600;
            font-size: .8rem;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border);
            z-index: 1;
        }
        .file-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
        }
        .file-table tr:hover td { background: #f8f9fa; }
        .file-table .actions { white-space: nowrap; }
        .file-name {
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 400px;
            overflow: hidden;
        }
        .file-name .file-icon { font-size: 1.1rem; flex-shrink: 0; }
        .file-name .name-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* =================== Search =================== */
        .search-bar { display: flex; gap: 8px; align-items: center; }
        .search-bar .form-control { flex: 1; }
        .search-type-group { display: flex; gap: 4px; }
        .search-type-btn {
            padding: 5px 10px;
            border: 1px solid var(--border);
            background: white;
            border-radius: var(--radius);
            font-size: .8rem;
            cursor: pointer;
        }
        .search-type-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        /* =================== Pagination =================== */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-top: 1px solid var(--border);
            margin-top: 12px;
        }
        .pagination-info { font-size: .85rem; color: var(--text-secondary); }
        .pagination-controls { display: flex; gap: 4px; align-items: center; }
        .pagination-btn {
            padding: 5px 10px;
            border: 1px solid var(--border);
            background: white;
            border-radius: var(--radius);
            font-size: .8rem;
            cursor: pointer;
        }
        .pagination-btn:hover:not(:disabled) { background: var(--bg); }
        .pagination-btn:disabled { opacity: .5; cursor: not-allowed; }
        /* =================== Alert =================== */
        .alert {
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: .85rem;
            margin-bottom: 14px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .alert.show { display: flex; }
        .alert-success { background: #e6f4ea; color: #1e7e34; border: 1px solid #b7e1c3; }
        .alert-error { background: #fce8e6; color: #c5221f; border: 1px solid #f5b6b3; }
        .alert-info { background: #e8f0fe; color: #1967d2; border: 1px solid #a8c7fa; }
        /* =================== Empty State =================== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
        /* =================== Folder Browser =================== */
        .folder-browser {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            margin-top: 8px;
        }
        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }
        .folder-card {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all .15s;
            font-size: .8rem;
        }
        .folder-card:hover { border-color: var(--primary); background: #f0f6ff; }
        .folder-card .folder-icon { font-size: 1.1rem; flex-shrink: 0; }
        /* =================== Breadcrumb =================== */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 0;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .breadcrumb-item {
            font-size: .85rem;
            color: var(--primary);
            cursor: pointer;
        }
        .breadcrumb-item:hover { text-decoration: underline; }
        .breadcrumb-item.active { color: var(--text); cursor: default; font-weight: 600; }
        .breadcrumb-sep { color: var(--text-secondary); font-size: .75rem; }
        /* =================== Checkbox =================== */
        .file-checkbox {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }
        .select-all-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .selected-count {
            font-size: .85rem;
            color: var(--primary);
            font-weight: 600;
        }
        .hidden { display: none !important; }
        .spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 2px solid rgba(66,133,244,.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* =================== Upload File List =================== */
        .upload-file-list { margin-top: 14px; }
        .upload-file-item {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 4px;
            gap: 8px;
            font-size: .85rem;
        }
        .upload-file-item .file-info { flex: 1; min-width: 0; overflow: hidden; }
        .upload-file-item .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .upload-file-item .file-size { color: var(--text-secondary); font-size: .8rem; flex-shrink: 0; }
        .upload-file-item .remove-btn {
            cursor: pointer;
            color: var(--danger);
            font-size: 1.1rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-logo">
            <span>&#128230;</span> MinIO 文件服务
        </div>
        <nav class="sidebar-nav">
            <div class="nav-item active" data-panel="config">
                <span class="nav-icon">&#9881;</span> 连接配置
            </div>
            <div class="nav-item" data-panel="upload">
                <span class="nav-icon">&#8679;</span> 文件上传
            </div>
            <div class="nav-item" data-panel="download">
                <span class="nav-icon">&#8681;</span> 文件下载
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">未连接</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <!-- Header -->
        <div class="main-header">
            <h2 id="pageTitle">连接配置</h2>
        </div>

        <!-- Content Area -->
        <div class="main-content">
            <!-- Alert -->
            <div class="alert alert-success" id="alertSuccess"><span id="alertSuccessText"></span></div>
            <div class="alert alert-error" id="alertError"><span id="alertErrorText"></span></div>
            <div class="alert alert-info" id="alertInfo"><span id="alertInfoText"></span></div>

            <!-- Config Panel -->
            <div class="panel active" id="panel-config">
                <div class="card">
                    <div class="card-title"><span class="icon">&#9881;</span> MinIO 连接设置</div>
                    <div class="form-group">
                        <label>服务器地址 (含端口和路径)</label>
                        <input type="text" class="form-control" id="serverAddress" placeholder="例: 10.204.184.236:8109/minio-api/">
                    </div>
                    <div class="form-group">
                        <label>Access Key</label>
                        <input type="text" class="form-control" id="accessKey" placeholder="MinIO Access Key">
                    </div>
                    <div class="form-group">
                        <label>Secret Key</label>
                        <input type="password" class="form-control" id="secretKey" placeholder="MinIO Secret Key">
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="saveConfig()">保存并连接</button>
                        <button class="btn btn-outline" onclick="testConnection()">测试连接</button>
                    </div>
                </div>
                <div class="card" id="bucketsCard" style="display:none">
                    <div class="card-title"><span class="icon">&#128451;</span> 已连接桶列表</div>
                    <div id="bucketsList"></div>
                </div>
            </div>

            <!-- Upload Panel -->
            <div class="panel" id="panel-upload">
                <div class="card">
                    <div class="card-title"><span class="icon">&#8679;</span> 文件上传</div>
                    <!-- Path Bar -->
                    <div class="path-bar" id="uploadPathBar">当前路径: <b>未选择桶</b></div>
                    <!-- Bucket Selection -->
                    <div class="form-group">
                        <label>选择目标桶</label>
                        <select class="form-control" id="uploadBucket" onchange="onUploadBucketChange()">
                            <option value="">-- 选择桶 --</option>
                        </select>
                    </div>
                    <!-- Folder Browser -->
                    <div class="folder-browser hidden" id="uploadFolderBrowser">
                        <div class="breadcrumb" id="uploadBreadcrumb"></div>
                        <div class="folder-grid" id="uploadFolderGrid"></div>
                    </div>
                    <button class="btn btn-sm btn-outline" id="uploadBrowseBtn" style="margin-top:8px;display:none" onclick="openUploadFolderBrowser()">浏览文件夹</button>
                    <!-- Drop Zone -->
                    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('multiFileInput').click()">
                        <div class="upload-icon">&#128196;</div>
                        <p><strong>拖拽文件到此处</strong> 或 点击选择文件</p>
                        <input type="file" id="multiFileInput" class="hidden" multiple onchange="handleMultiFileSelect(this)">
                    </div>
                    <!-- File List -->
                    <div id="uploadFileList" class="upload-file-list hidden">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                            <strong>待上传文件 (<span id="uploadFileCount">0</span>)</strong>
                            <div class="btn-group">
                                <button class="btn btn-sm btn-outline" onclick="clearUploadList()">清空列表</button>
                                <button class="btn btn-sm btn-success" id="batchUploadBtn" onclick="batchUpload()">&#11015; 批量上传</button>
                            </div>
                        </div>
                        <div id="uploadFileItems"></div>
                    </div>
                    <!-- Progress -->
                    <div id="uploadProgress" style="display:none">
                        <div class="progress-info">
                            <span id="uploadProgressText">准备上传...</span>
                            <span id="uploadProgressPercent">0%</span>
                        </div>
                        <div class="progress-bar-container">
                            <div class="progress-bar" id="uploadProgressBar" style="width:0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Download Panel -->
            <div class="panel" id="panel-download">
                <div class="card">
                    <div class="card-title"><span class="icon">&#8681;</span> 文件下载</div>
                    <!-- Path Bar -->
                    <div class="path-bar" id="downloadPathBar">当前路径: <b>未选择桶</b></div>
                    <!-- Bucket Selection -->
                    <div class="form-group" style="display:flex;gap:8px;align-items:end">
                        <div style="flex:1">
                            <label>选择桶</label>
                            <select class="form-control" id="downloadBucket" onchange="onDownloadBucketChange()">
                                <option value="">-- 选择桶 --</option>
                            </select>
                        </div>
                        <div style="flex:2">
                            <label>搜索文件</label>
                            <div class="search-bar">
                                <input type="text" class="form-control" id="downloadSearchInput" placeholder="输入文件名搜索...">
                                <div class="search-type-group">
                                    <button class="search-type-btn active" data-type="contains" onclick="setDownloadSearchType('contains')">包含</button>
                                    <button class="search-type-btn" data-type="regex" onclick="setDownloadSearchType('regex')">正则</button>
                                </div>
                            </div>
                        </div>
                        <button class="btn btn-primary" style="margin-bottom:0;height:38px" onclick="loadDownloadFiles()">查询</button>
                    </div>
                    <!-- Folder Browser -->
                    <div class="folder-browser hidden" id="downloadFolderBrowser">
                        <div class="breadcrumb" id="downloadBreadcrumb"></div>
                        <div class="folder-grid" id="downloadFolderGrid"></div>
                    </div>
                    <button class="btn btn-sm btn-outline" id="downloadBrowseBtn" style="margin-top:8px;display:none" onclick="openDownloadFolderBrowser()">浏览文件夹</button>
                    <!-- Select All Bar -->
                    <div class="select-all-bar hidden" id="downloadSelectAllBar">
                        <label class="form-check">
                            <input type="checkbox" class="file-checkbox" id="downloadSelectAllCheckbox" onchange="toggleDownloadSelectAll()"> 全选
                        </label>
                        <span class="selected-count" id="downloadSelectedCount">已选择 0 个文件</span>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-danger" onclick="batchDeleteSelected()">&#128465; 删除所选</button>
                            <button class="btn btn-sm btn-primary" onclick="batchDownloadSelected()">&#128230; 批量下载</button>
                        </div>
                    </div>
                    <!-- File List -->
                    <div class="file-table-area" id="downloadFileListArea">
                        <div class="empty-state"><div class="empty-icon">&#128194;</div><p>选择桶后点击查询查看文件列表</p></div>
                    </div>
                    <!-- Pagination -->
                    <div class="pagination" id="downloadPagination" style="display:none">
                        <div class="pagination-info" id="downloadPaginationInfo"></div>
                        <div class="pagination-controls">
                            <span style="font-size:.85rem;color:var(--text-secondary)">每页</span>
                            <select class="form-control" id="downloadPageSize" onchange="onDownloadPageSizeChange()" style="width:80px;display:inline;padding:4px 8px">
                                <option value="10" selected>10</option>
                                <option value="20">20</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                            <span style="font-size:.85rem;color:var(--text-secondary)">条</span>
                            <button class="pagination-btn" id="downloadPageFirst" onclick="goDownloadPage(1)">&#8810;</button>
                            <button class="pagination-btn" id="downloadPagePrev" onclick="goDownloadPage(currentDownloadPage - 1)">&#8811;</button>
                            <span id="downloadPageNum" style="font-size:.85rem;min-width:60px;text-align:center"></span>
                            <button class="pagination-btn" id="downloadPageNext" onclick="goDownloadPage(currentDownloadPage + 1)">&#8812;</button>
                            <button class="pagination-btn" id="downloadPageLast" onclick="goDownloadPage(totalDownloadPages)">&#8811;</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    // =================== State ===================
    var allDownloadFiles = [];
    var selectedDownloadFiles = {};
    var downloadCurrentPrefix = '';
    var uploadCurrentPrefix = '';
    var downloadCurrentSearch = '';
    var downloadCurrentTotal = 0;
    var currentDownloadPage = 1;
    var downloadPageSize = 10;
    var totalDownloadPages = 1;
    var currentDownloadSearchType = 'contains';
    var uploadFiles = [];
    var activeDownloads = {};
    var uploadId = '';
    var progressTimer = null;

    // =================== Tab Navigation ===================
    document.querySelectorAll('.nav-item').forEach(function(item) {
        item.addEventListener('click', function() {
            document.querySelectorAll('.nav-item').forEach(function(el) { el.classList.remove('active'); });
            this.classList.add('active');
            var panel = this.getAttribute('data-panel');
            document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
            document.getElementById('panel-' + panel).classList.add('active');
            document.getElementById('pageTitle').textContent = this.textContent.trim();
        });
    });

    // =================== API Request ===================
    function apiRequest(method, url, data, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open(method, '/minio' + url, true);
        xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.timeout = 60000;
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                try {
                    var resp = JSON.parse(xhr.responseText);
                    if (xhr.status === 200) callback(null, resp);
                    else callback(resp.error || 'Request failed: ' + xhr.status, null);
                } catch(e) { callback('JSON parse error', null); }
            }
        };
        xhr.onerror = function() { callback('Network error', null); };
        xhr.ontimeout = function() { callback('Request timeout', null); };
        if (data) xhr.send(JSON.stringify(data)); else xhr.send();
    }

    // =================== Utility ===================
    function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

    function escapeAttr(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/\\/g, '&#92;');
    }

    function formatSize(bytes) {
        if (!bytes || bytes === 0) return '0 B';
        var k = 1024;
        var sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        var i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function fileBasename(path) {
        if (!path) return '';
        var parts = path.replace(/\/+$/, '').split('/');
        return parts[parts.length - 1] || '';
    }

    function getFileIcon(filename) {
        if (!filename) return '&#128196;';
        var ext = filename.split('.').pop().toLowerCase();
        var map = {
            'pdf': '&#128230;', 'doc': '&#128196;', 'docx': '&#128196;',
            'xls': '&#128202;', 'xlsx': '&#128202;', 'csv': '&#128202;',
            'jpg': '&#127748;', 'jpeg': '&#127748;', 'png': '&#127748;', 'gif': '&#127748;', 'bmp': '&#127748;', 'svg': '&#127748;',
            'mp4': '&#127916;', 'avi': '&#127916;', 'mkv': '&#127916;', 'mov': '&#127916;',
            'mp3': '&#127925;', 'wav': '&#127925;', 'flac': '&#127925;',
            'zip': '&#128230;', 'rar': '&#128230;', '7z': '&#128230;', 'tar': '&#128230;', 'gz': '&#128230;',
            'txt': '&#128196;', 'md': '&#128196;',
            'js': '&#128187;', 'py': '&#128187;', 'java': '&#128187;', 'html': '&#128187;', 'css': '&#128187;'
        };
        return map[ext] || '&#128196;';
    }

    // =================== Alert ===================
    function showAlert(type, message) {
        var alertMap = { success: 'alertSuccess', error: 'alertError', info: 'alertInfo' };
        var textMap = { success: 'alertSuccessText', error: 'alertErrorText', info: 'alertInfoText' };
        var alert = document.getElementById(alertMap[type]);
        var text = document.getElementById(textMap[type]);
        text.textContent = message;
        alert.classList.add('show');
        clearTimeout(alert._timer);
        alert._timer = setTimeout(function() { alert.classList.remove('show'); }, 5000);
    }

    function batchUpload() {
        if (!uploadFiles.length) { showAlert('error', '请先选择文件'); return; }
        var bucket = document.getElementById('uploadBucket').value;
        if (!bucket) { showAlert('error', '请先选择目标桶'); return; }
        document.getElementById('batchUploadBtn').disabled = true;
        document.getElementById('uploadProgress').style.display = 'block';
        var currentFile = 0;
        var prefix = uploadCurrentPrefix || '';

        function uploadNext() {
            if (currentFile >= uploadFiles.length) {
                updateUploadProgress(uploadFiles.length, uploadFiles.length, 100);
                showAlert('success', '全部文件上传完成！');
                document.getElementById('batchUploadBtn').disabled = false;
                return;
            }
            var file = uploadFiles[currentFile];
            updateUploadProgress(currentFile, uploadFiles.length, Math.round((currentFile / uploadFiles.length) * 100));
            document.getElementById('uploadProgressText').textContent = '上传中: ' + file.name;

            var formData = new FormData();
            formData.append('file', file);
            formData.append('bucket', bucket);
            formData.append('upload_id', 'upload-' + Date.now());
            var uploadPath = prefix ? prefix + '/' + file.name : file.name;
            formData.append('custom_name', uploadPath);

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/minio/api/upload', true);
            xhr.upload.addEventListener('progress', function(e) {
                if (e.lengthComputable) {
                    var pct = Math.round((e.loaded / e.total) * 100);
                    updateUploadProgress(currentFile, uploadFiles.length, pct);
                }
            });
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    try {
                        var resp = JSON.parse(xhr.responseText);
                        if (xhr.status === 200) {
                            currentFile++;
                            uploadNext();
                        } else {
                            showAlert('error', '上传失败: ' + (resp.error || '未知错误'));
                            document.getElementById('batchUploadBtn').disabled = false;
                        }
                    } catch(e) {
                        showAlert('error', '上传失败: ' + e.message);
                        document.getElementById('batchUploadBtn').disabled = false;
                    }
                }
            };
            xhr.send(formData);
        }
        uploadNext();
    }

    // =================== Load Download Files ===================
    function loadDownloadFiles() {
        var bucket = document.getElementById('downloadBucket').value;
        if (!bucket) { showAlert('error', '请先选择桶'); return; }
        var searchInput = document.getElementById('downloadSearchInput');
        var pattern = searchInput ? searchInput.value.trim() : '';
        var prefix = downloadCurrentPrefix;
        downloadCurrentSearch = pattern;
        updateDownloadPathBar();
        currentDownloadPage = 1;
        var hasSearch = !!pattern;
        var query = '?bucket=' + encodeURIComponent(bucket);
        if (prefix) query += '&prefix=' + encodeURIComponent(prefix);
        query += '&offset=' + ((currentDownloadPage - 1) * downloadPageSize);
        query += '&limit=' + downloadPageSize;
        document.getElementById('downloadFileListArea').innerHTML = '<div class="empty-state"><div class="spinner"></div><p style="margin-top:12px">加载中...</p></div>';
        document.getElementById('downloadPagination').style.display = 'none';
        var url;
        if (hasSearch) {
            query = '?bucket=' + encodeURIComponent(bucket) + '&pattern=' + encodeURIComponent(pattern) + '&type=' + currentDownloadSearchType;
            if (prefix) query += '&prefix=' + encodeURIComponent(prefix);
            url = '/search' + query;
        } else {
            url = '/files' + query;
        }
        apiRequest('GET', url, null, function(err, resp) {
            if (err) {
                showAlert('error', '获取文件列表失败: ' + err);
                document.getElementById('downloadFileListArea').innerHTML = '<div class="empty-state"><div class="empty-icon">&#9888;</div><p>加载失败</p></div>';
                document.getElementById('downloadSelectAllBar').classList.add('hidden');
                allDownloadFiles = []; selectedDownloadFiles = {};
                return;
            }
            allDownloadFiles = resp.files || [];
            selectedDownloadFiles = {};
            downloadCurrentTotal = resp.total_collected || allDownloadFiles.length;
            if (allDownloadFiles.length === 0) {
                document.getElementById('downloadFileListArea').innerHTML = '<div class="empty-state"><div class="empty-icon">&#128194;</div><p>该目录暂无文件</p></div>';
                document.getElementById('downloadSelectAllBar').classList.add('hidden');
                document.getElementById('downloadPagination').style.display = 'none';
                return;
            }
            totalDownloadPages = Math.max(1, Math.ceil(downloadCurrentTotal / downloadPageSize));
            document.getElementById('downloadSelectAllBar').classList.remove('hidden');
            renderDownloadFileTable(allDownloadFiles, bucket);
            renderPagination();
        });
    }

        currentDownloadPage = page;

    function renderPagination() {
        var pagination = document.getElementById('downloadPagination');
        if (totalDownloadPages <= 1) { pagination.style.display = 'none'; return; }
        pagination.style.display = 'flex';
        var start = (currentDownloadPage - 1) * downloadPageSize + 1;
        var end = Math.min(currentDownloadPage * downloadPageSize, downloadCurrentTotal);
        document.getElementById('downloadPaginationInfo').textContent = '显示 ' + start + '-' + end + ' / 共 ' + downloadCurrentTotal + ' 条';
        document.getElementById('downloadPageNum').textContent = currentDownloadPage + ' / ' + totalDownloadPages;
        document.getElementById('downloadPageFirst').disabled = (currentDownloadPage <= 1);
        document.getElementById('downloadPagePrev').disabled = (currentDownloadPage <= 1);
        document.getElementById('downloadPageNext').disabled = (currentDownloadPage >= totalDownloadPages);
        document.getElementById('downloadPageLast').disabled = (currentDownloadPage >= totalDownloadPages);
    }

    function updateDownloadSelectAllState() {
        var checkboxes = document.querySelectorAll('#downloadFileListArea .file-checkbox[data-idx]');
        var checkedCount = Array.from(checkboxes).filter(function(cb) { return cb.checked; }).length;
        var allCount = checkboxes.length;
        var tableCb = document.querySelector('#downloadFileListArea .file-table th .file-checkbox');
        var toolbarCb = document.getElementById('downloadSelectAllCheckbox');
        if (tableCb) tableCb.indeterminate = checkedCount > 0 && checkedCount < allCount;
        if (tableCb) tableCb.checked = allCount > 0 && checkedCount === allCount;
        if (toolbarCb) toolbarCb.checked = allCount > 0 && checkedCount === allCount;

    // =================== File Operations ===================
    function hasInAppApi() {
        return !!(window.pywebview && window.pywebview.api && window.pywebview.api.download);
    }

    function copyFileName(name) {
        function fallbackCopy() {
            var ta = document.createElement('textarea');
            ta.value = name;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            var ok = false;
            try { ok = document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
            return ok;
        }
        function finish(ok) {
            if (ok) showAlert('success', '已复制: ' + name);
            else showAlert('error', '复制失败，请手动选择复制');
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(name).then(
                function() { finish(true); },
                function() { finish(fallbackCopy()); }
            );
        } else {
            finish(fallbackCopy());
        }
    }

    function downloadFile(bucket, objectName) {
        var downloadId = 'dl-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6);
        var basename = fileBasename(objectName);
        activeDownloads[downloadId] = { name: basename, start: Date.now() };
        if (hasInAppApi()) {
            showAlert('info', '正在保存 "' + basename + '"，请选择保存位置...');
            window.pywebview.api.download(bucket, objectName, downloadId).then(function(res) {
                if (res.status === 'ok') {
                    showAlert('success', '已保存到: ' + res.path);
                    delete activeDownloads[downloadId];
                } else if (res.status !== 'cancelled') {
                    showAlert('error', '下载失败: ' + res.message);
                    delete activeDownloads[downloadId];
                }
            });
        } else {
            window.open('/minio/api/download?bucket=' + encodeURIComponent(bucket) + '&object_name=' + encodeURIComponent(objectName), '_blank');
        }
    }

    function batchDownloadSelected() {
        var bucket = document.getElementById('downloadBucket').value;
        var names = Object.keys(selectedDownloadFiles);
        if (names.length === 0) { showAlert('error', '请先选择要下载的文件'); return; }
        if (hasInAppApi()) {
            showAlert('info', '正在准备下载 ' + names.length + ' 个文件...');
            window.pywebview.api.batch_download(bucket, names).then(function(res) {
                if (res.status === 'ok') showAlert('success', '已保存到: ' + res.path);
                else if (res.status !== 'cancelled') showAlert('error', '下载失败: ' + res.message);
            });
        } else {
            var filesParam = encodeURIComponent(names.join(','));
            window.open('/minio/api/batch-download?bucket=' + encodeURIComponent(bucket) + '&files=' + filesParam, '_blank');
        }
    }

    function deleteFile(bucket, objectName) {
        if (!confirm('确定删除文件 "' + fileBasename(objectName) + '"？')) return;
        apiRequest('POST', '/delete', { bucket: bucket, object_name: objectName }, function(err, resp) {
            if (err) { showAlert('error', '删除失败: ' + err); return; }
            showAlert('success', '文件已删除');
            loadDownloadFiles();
        });
    }

    function batchDeleteSelected() {
        var bucket = document.getElementById('downloadBucket').value;
        var names = Object.keys(selectedDownloadFiles);
        if (names.length === 0) { showAlert('error', '请先选择要删除的文件'); return; }
        if (!confirm('确定删除选中的 ' + names.length + ' 个文件吗？')) return;
        apiRequest('POST', '/delete-many', { bucket: bucket, objects: names }, function(err, resp) {
            if (err) { showAlert('error', '删除失败: ' + err); return; }
            showAlert('success', '已删除 ' + names.length + ' 个文件');
            selectedDownloadFiles = {};
            updateDownloadSelectedCount();
            loadDownloadFiles();
        });
    }

    // =================== Init ===================
    loadConfig();
    </script>
</body>
</html>
